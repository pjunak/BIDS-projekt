[project]
name = "bids-scrapers"
version = "0.1.0"
description = "Data collection for the BIDS project: Sreality listings + ČSÚ / MPSV / Policie ČR open data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.6",
    "requests>=2.31",
]

[project.scripts]
bids-scrape = "bids_scrapers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bids_scrapers"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
